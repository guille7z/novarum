name: Release desktop development build

on:
  push:
    paths:
      - 'apps/electron/**'
      - '.github/workflows/desktop-development-release.yml'

permissions:
  contents: read

env:
  DESKTOP_VERSION: 0.1.1-dev.${{ github.run_number }}

jobs:
  build-linux-windows:
    name: Build desktop (Linux and Windows)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container: electronuserland/builder:wine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WINEDEBUG: '-all'
        run: bun run --filter desktop build:linux-windows

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-windows
          path: |
            apps/electron/dist/*.AppImage
            apps/electron/dist/*.deb
            apps/electron/dist/*.exe
            apps/electron/dist/*.blockmap
            apps/electron/dist/dev*.yml
          if-no-files-found: error

  build-macos:
    name: Build desktop (macOS)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bun run --filter desktop build:macos

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/electron/dist/*.dmg
            apps/electron/dist/*.zip
            apps/electron/dist/*.blockmap
            apps/electron/dist/dev*.yml
          if-no-files-found: error

  release:
    name: Publish development release
    needs:
      - build-linux-windows
      - build-macos
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha_tag="${GITHUB_SHA::7}-desktop"
          release_tag="v${DESKTOP_VERSION}"
          notes="Development build for commit ${GITHUB_SHA}."

          if ! git rev-parse "$sha_tag" >/dev/null 2>&1; then
            git tag "$sha_tag" "$GITHUB_SHA"
            git push origin "refs/tags/$sha_tag"
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber
          else
            gh release create "$release_tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$sha_tag" \
              --notes "$notes" \
              --prerelease
          fi
